name: GDMP CI

on:
  pull_request:
    paths:
      - '.github/workflows/salts-mediapipe.yml'
      - 'addons/GDMP/**'
      - 'src/gdmp/**'
      - 'tests/mediapipe/**'
      - 'tests/android/check_bundle.py'
  push:
    branches: [master]
    paths:
      - '.github/workflows/salts-mediapipe.yml'
      - 'addons/GDMP/**'
      - 'src/gdmp/**'
      - 'tests/mediapipe/**'
      - 'tests/android/check_bundle.py'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            target: desktop
            arch: x86_64
            opencv: sdk
            bazel: bazel-6.5.0-linux-x86_64
            bazel_sha: a40ac69263440761199fcb8da47ad4e3f328cbe79ffbf4ecc14e5ba252857307
            godot_asset: Godot_v4.5.2-stable_linux.x86_64.zip
            godot_sha: 87f6e6be292929e363d15ed9052f277b2ba4e95ed994e1e099048097be2dfd03
            godot_bin: Godot_v4.5.2-stable_linux.x86_64
          - platform: macos-arm64
            runner: macos-15
            target: desktop
            arch: arm64
            opencv: source
            bazel: bazel-6.5.0-darwin-arm64
            bazel_sha: c6b6dc17efcdf13fba484c6fe0b6c3361b888ae7b9573bc25a2dbe8c502448eb
            godot_asset: Godot_v4.5.2-stable_macos.universal.zip
            godot_sha: 2a3f35cf5813b0d26e3f4c15dabc5e7c58407fceec7bae5291740772f72d141a
            godot_bin: Godot.app/Contents/MacOS/Godot
          - platform: android-arm64
            runner: ubuntu-24.04
            target: android
            arch: arm64
            opencv: sdk
            bazel: bazel-6.5.0-linux-x86_64
            bazel_sha: a40ac69263440761199fcb8da47ad4e3f328cbe79ffbf4ecc14e5ba252857307
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/cache/restore@v6.1.0
        id: cache
        with:
          path: |
            build-mediapipe/downloads
            build-mediapipe/repository-cache
            build-mediapipe/disk-cache
          key: gdmp-${{ matrix.platform }}-${{ hashFiles('src/gdmp/**') }}
          restore-keys: gdmp-${{ matrix.platform }}-
      - name: Download pinned Bazel
        shell: bash
        env:
          ASSET: ${{ matrix.bazel }}
          SHA: ${{ matrix.bazel_sha }}
        run: |
          mkdir -p build-mediapipe/downloads
          file="build-mediapipe/downloads/$ASSET"
          if [[ ! -f "$file" ]]; then
            curl -fsSL --retry 3 "https://releases.bazel.build/6.5.0/release/$ASSET" -o "$file"
          fi
          printf '%s  %s\n' "$SHA" "$file" | shasum -a 256 -c -
          chmod +x "$file"
      - name: Build the GDMP GDExtension
        shell: bash
        env:
          CC: clang
          CXX: clang++
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
          BAZEL: ${{ matrix.bazel }}
          OPENCV: ${{ matrix.opencv }}
        run: |
          if [[ "$TARGET" == android ]]; then
            export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.3.13750724"
          fi
          python3 -B src/gdmp/build.py "$TARGET" --arch "$ARCH" \
            --bazel "build-mediapipe/downloads/$BAZEL" --opencv "$OPENCV"
      - name: Run face, hand, and pose inference in Godot
        if: matrix.target == 'desktop'
        shell: bash
        env:
          ASSET: ${{ matrix.godot_asset }}
          SHA: ${{ matrix.godot_sha }}
          GODOT_BIN: ${{ matrix.godot_bin }}
        run: |
          curl -fsSL --retry 3 "https://github.com/godotengine/godot-builds/releases/download/4.5.2-stable/$ASSET" -o "$RUNNER_TEMP/$ASSET"
          printf '%s  %s\n' "$SHA" "$RUNNER_TEMP/$ASSET" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/$ASSET" -d "$RUNNER_TEMP/godot"
          bash tests/mediapipe/run.sh build-mediapipe "$RUNNER_TEMP/godot/$GODOT_BIN"
      - name: Check the Android ARM64 library
        if: matrix.target == 'android'
        run: |
          python3 -B tests/mediapipe/check_android.py \
            build-mediapipe/addons/GDMP/libs/arm64/libGDMP.android.so \
            "$ANDROID_HOME/ndk/27.3.13750724"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: GDMP-${{ matrix.platform }}
          path: build-mediapipe/addons
          if-no-files-found: error
      - uses: actions/cache/save@v6.1.0
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            build-mediapipe/downloads
            build-mediapipe/repository-cache
            build-mediapipe/disk-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}
