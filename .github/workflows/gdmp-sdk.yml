name: GDMP CI

on:
  pull_request:
    paths:
      - 'addons/GDMP/**'
      - 'addons/salts_camera/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'demos/gdmp/**'
      - 'src/gdmp/**'
      - 'src/salts_camera/**'
      - 'tests/mediapipe/**'
      - 'tests/android/check_bundle.py'
      - 'tests/android/export_project/addons/salts_camera_apk/**'
      - 'tests/godot/preview_fixture.*'
  push:
    branches: [master]
    paths:
      - 'addons/GDMP/**'
      - 'addons/salts_camera/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'demos/gdmp/**'
      - 'src/gdmp/**'
      - 'src/salts_camera/**'
      - 'tests/mediapipe/**'
      - 'tests/android/check_bundle.py'
      - 'tests/android/export_project/addons/salts_camera_apk/**'
      - 'tests/godot/preview_fixture.*'
  workflow_dispatch:
    inputs:
      sdk_tag:
        description: MediaPipe SDK release tag
        required: true
        type: string
      sdk_checksums_sha256:
        description: SHA-256 of the release SHA256SUMS file
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target == 'windows' && 'Windows LLVM-MinGW' || matrix.target }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            arch: x64
            runner: ubuntu-24.04
            godot_asset: Godot_v4.7.2-stable_linux.x86_64.zip
            godot_sha: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
            godot_bin: Godot_v4.7.2-stable_linux.x86_64
          - target: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            godot_asset: Godot_v4.7.2-stable_linux.arm64.zip
            godot_sha: 5dd0d86405cf7e8adf79fb6377b38ba682a2846cb378ffe5364f38c01ad29b9d
            godot_bin: Godot_v4.7.2-stable_linux.arm64
          - target: android
            arch: x64
            runner: ubuntu-24.04
            android_abi: x86_64
            godot_arch: x86_64
          - target: android
            arch: arm64
            runner: ubuntu-24.04
            android_abi: arm64-v8a
            godot_arch: arm64
          - target: macos
            arch: arm64
            runner: macos-15
            osx_arch: arm64
            godot_asset: Godot_v4.7.2-stable_macos.universal.zip
            godot_sha: c58a24e31d720be9d62f60cb5627c4e695fb72f21b0cfe1bc9ccaa9a3b3ba63e
            godot_bin: Godot.app/Contents/MacOS/Godot
          - target: windows
            arch: x64
            runner: windows-2025
            godot_asset: Godot_v4.7.2-stable_win64.exe.zip
            godot_sha: 731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953
            godot_bin: Godot_v4.7.2-stable_win64_console.exe
          - target: windows
            arch: arm64
            runner: windows-11-arm
            godot_asset: Godot_v4.7.2-stable_windows_arm64.exe.zip
            godot_sha: 2d206e0b1d2366eb3508971c670c52333dcd7218b818102d77ca7ceaa86892ba
            godot_bin: Godot_v4.7.2-stable_windows_arm64_console.exe
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: qigao/vcpkg-cache/.github/actions/setup-llvm-mingw@v0.1.3
        id: mingw
        if: matrix.target == 'windows'
        with:
          target: ${{ matrix.arch }}
          build-type: toolchain-only
      - name: Install Linux system libraries
        if: matrix.target == 'linux'
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          packages=(libegl-dev libgles-dev libegl-mesa0 libgl1-mesa-dri)
          if [[ "$ARCH" == x64 ]]; then
            packages+=(libpipewire-0.3-dev libx11-dev libxext-dev)
          fi
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends "${packages[@]}"
      - name: Build the GDMP extension
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
          SDK_TAG: ${{ inputs.sdk_tag || 'sdk-v1.2.2' }}
          SDK_CHECKSUMS_SHA: ${{ inputs.sdk_checksums_sha256 || 'e4943aeb2e8f58cf2e7fb4bd93d2404f1924f8996210be531bdf0b7d2523984d' }}
          ANDROID_ABI: ${{ matrix.android_abi }}
          OSX_ARCH: ${{ matrix.osx_arch }}
          MINGW_TOOLCHAIN: ${{ steps.mingw.outputs.toolchain-file }}
        run: |
          [[ "$SDK_TAG" =~ ^sdk-v1\.2\.2(-[A-Za-z0-9.-]+)?$ ]]
          [[ "$SDK_CHECKSUMS_SHA" =~ ^[0-9a-f]{64}$ ]]
          inputs="$RUNNER_TEMP/gdmp"
          mkdir -p "$inputs"/{bindings,mediapipe}
          download() {
            local url=$1 sha=$2 file=$3
            curl -fsSL --retry 3 "$url" -o "$file"
            if [[ "$TARGET" == windows ]]; then
              printf '%s  %s\n' "$sha" "$file" | sha256sum -c -
            else
              printf '%s  %s\n' "$sha" "$file" | shasum -a 256 -c -
            fi
          }

          release="https://github.com/qigao/mediapipe/releases/download/$SDK_TAG"
          sdk="mediapipe-tasks-1.2.2-$TARGET-$ARCH.tar.gz"
          download "$release/SHA256SUMS" "$SDK_CHECKSUMS_SHA" "$inputs/SHA256SUMS"
          sdk_sha=$(awk -v file="$sdk" '$2 == file { print $1 }' "$inputs/SHA256SUMS")
          [[ "$sdk_sha" =~ ^[0-9a-f]{64}$ ]]
          download "$release/$sdk" "$sdk_sha" "$inputs/$sdk"
          bindings=507ed9d840c01a3c5b2a39af8bb4000bfac30bf5
          download "https://codeload.github.com/godotengine/godot-cpp/tar.gz/$bindings" \
            30da4ac295997061a6af81ae531510efd4e6a86e506eb4466edc0898ef3fe048 "$inputs/godot-cpp.tar.gz"
          (
            cd "$inputs"
            tar -xzf "$sdk" -C mediapipe
            tar -xzf godot-cpp.tar.gz --strip-components=1 -C bindings
          )

          args=()
          case "$TARGET" in
            linux) args+=(-DCMAKE_CXX_COMPILER=clang++) ;;
            macos) args+=(-DCMAKE_CXX_COMPILER=clang++ -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
                         "-DCMAKE_OSX_ARCHITECTURES=$OSX_ARCH") ;;
            android) args+=("-DCMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/27.3.13750724/build/cmake/android.toolchain.cmake"
                           "-DANDROID_ABI=$ANDROID_ABI" -DANDROID_PLATFORM=android-26) ;;
            windows) args+=("-DCMAKE_TOOLCHAIN_FILE=$MINGW_TOOLCHAIN") ;;
          esac
          cmake -S src/gdmp -B build-gdmp-sdk -G Ninja -DCMAKE_BUILD_TYPE=Release \
            "-DMediaPipe_DIR=$inputs/mediapipe/lib/cmake/MediaPipe" \
            "-DGODOT_CPP_DIR=$inputs/bindings" "${args[@]}"
          cmake --build build-gdmp-sdk --parallel 4
      - name: Run vision, text, and audio inference in Godot
        if: matrix.target != 'android'
        shell: bash
        env:
          GODOT_ASSET: ${{ matrix.godot_asset }}
          GODOT_SHA: ${{ matrix.godot_sha }}
          GODOT_BIN: ${{ matrix.godot_bin }}
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          inputs="$RUNNER_TEMP/gdmp"
          curl -fsSL --retry 3 "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/$GODOT_ASSET" \
            -o "$inputs/godot.zip"
          if [[ $OSTYPE == darwin* ]]; then
            printf '%s  %s\n' "$GODOT_SHA" "$inputs/godot.zip" | shasum -a 256 -c -
          else
            printf '%s  %s\n' "$GODOT_SHA" "$inputs/godot.zip" | sha256sum -c -
          fi
          mkdir "$inputs/engine"
          (cd "$inputs/engine" && cmake -E tar xf ../godot.zip)
          bash tests/mediapipe/run.sh build-gdmp-sdk "$inputs/engine/$GODOT_BIN"
      - name: Run the GDMP demo with Salts Camera
        if: matrix.target == 'linux' && matrix.arch == 'x64'
        shell: bash
        env:
          GODOT_BIN: ${{ matrix.godot_bin }}
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          godot="$RUNNER_TEMP/gdmp/engine/$GODOT_BIN"
          bash tests/mediapipe/build_demo_camera.sh "$RUNNER_TEMP/demo-camera-inputs" "$godot" x86_64
          bash tests/mediapipe/run_demo.sh build-gdmp-sdk "$godot" build-demo-camera
      - name: Check the Android library
        if: matrix.target == 'android'
        shell: bash
        env:
          GODOT_ARCH: ${{ matrix.godot_arch }}
        run: |
          python3 -B tests/mediapipe/check_android.py \
            "build-gdmp-sdk/addons/GDMP/libs/$GODOT_ARCH/libGDMP.android.so" \
            "$ANDROID_HOME/ndk/27.3.13750724" "$GODOT_ARCH"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: gdmp-sdk-${{ matrix.target }}-${{ matrix.arch }}
          path: build-gdmp-sdk/addons/GDMP
          if-no-files-found: error
