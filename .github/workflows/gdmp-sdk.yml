name: GDMP with MediaPipe SDK

on:
  workflow_dispatch:
    inputs:
      sdk_tag:
        description: MediaPipe SDK release tag
        required: true
        type: string
      x64_sha256:
        description: Linux x64 SDK archive SHA-256
        required: true
        type: string
      arm64_sha256:
        description: Linux ARM64 SDK archive SHA-256
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            sdk_sha: ${{ inputs.x64_sha256 }}
            godot_arch: x86_64
            godot_sha: 87f6e6be292929e363d15ed9052f277b2ba4e95ed994e1e099048097be2dfd03
          - arch: arm64
            runner: ubuntu-24.04-arm
            sdk_sha: ${{ inputs.arm64_sha256 }}
            godot_arch: arm64
            godot_sha: 97ad6d1b74020bd591520e4f8810c6a07451af75eefa0932f57daeb805124618
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install EGL and OpenGL ES libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl-dev libgles-dev libegl-mesa0 libgl1-mesa-dri
      - name: Build GDMP and run GPU inference
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          SDK_TAG: ${{ inputs.sdk_tag }}
          SDK_SHA: ${{ matrix.sdk_sha }}
          GODOT_ARCH: ${{ matrix.godot_arch }}
          GODOT_SHA: ${{ matrix.godot_sha }}
          EGL_PLATFORM: surfaceless
        run: |
          [[ "$SDK_TAG" =~ ^sdk-v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          [[ "$SDK_SHA" =~ ^[0-9a-f]{64}$ ]]
          inputs="$RUNNER_TEMP/gdmp"
          mkdir -p "$inputs"/{bindings,engine,mediapipe}
          download() {
            local url=$1 sha=$2 file=$3
            curl -fsSL --retry 3 "$url" -o "$file"
            printf '%s  %s\n' "$sha" "$file" | sha256sum -c -
          }

          sdk="mediapipe-tasks-0.10.26-linux-$ARCH.tar.gz"
          engine="Godot_v4.5.2-stable_linux.$GODOT_ARCH"
          bindings=e83fd0904c13356ed1d4c3d09f8bb9132bdc6b77
          download "https://github.com/qigao/mediapipe/releases/download/$SDK_TAG/$sdk" \
            "$SDK_SHA" "$inputs/$sdk"
          download "https://codeload.github.com/godotengine/godot-cpp/tar.gz/$bindings" \
            d4c03daf46c8bef4544614182b0762c3e32789151c7f8f44e8eb2053d5cddeba "$inputs/godot-cpp.tar.gz"
          download "https://github.com/godotengine/godot-builds/releases/download/4.5.2-stable/$engine.zip" \
            "$GODOT_SHA" "$inputs/godot.zip"

          tar -xzf "$inputs/$sdk" -C "$inputs/mediapipe"
          tar -xzf "$inputs/godot-cpp.tar.gz" --strip-components=1 -C "$inputs/bindings"
          unzip -q "$inputs/godot.zip" -d "$inputs/engine"

          cmake -S src/gdmp -B build-gdmp-sdk -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++ "-DCMAKE_PREFIX_PATH=$inputs/mediapipe" \
            "-DGODOT_CPP_DIR=$inputs/bindings"
          cmake --build build-gdmp-sdk --parallel 4
          bash tests/mediapipe/run.sh build-gdmp-sdk "$inputs/engine/$engine"
