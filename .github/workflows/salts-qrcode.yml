name: Salts QR Code CI

on:
  pull_request:
    paths:
      - '.github/workflows/salts-qrcode.yml'
      - 'addons/salts_qrcode/**'
      - 'src/salts_qrcode/**'
      - 'tests/salts_qrcode/**'
      - 'tests/android/check_bundle.py'
  push:
    branches: [master]
    paths:
      - '.github/workflows/salts-qrcode.yml'
      - 'addons/salts_qrcode/**'
      - 'src/salts_qrcode/**'
      - 'tests/salts_qrcode/**'
      - 'tests/android/check_bundle.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            arch: x64
            runner: ubuntu-24.04
            godot_asset: Godot_v4.5.2-stable_linux.x86_64.zip
            godot_sha: 87f6e6be292929e363d15ed9052f277b2ba4e95ed994e1e099048097be2dfd03
            godot_bin: Godot_v4.5.2-stable_linux.x86_64
          - target: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            godot_asset: Godot_v4.5.2-stable_linux.arm64.zip
            godot_sha: 97ad6d1b74020bd591520e4f8810c6a07451af75eefa0932f57daeb805124618
            godot_bin: Godot_v4.5.2-stable_linux.arm64
          - target: macos
            arch: arm64
            runner: macos-15
            godot_asset: Godot_v4.5.2-stable_macos.universal.zip
            godot_sha: 2a3f35cf5813b0d26e3f4c15dabc5e7c58407fceec7bae5291740772f72d141a
            godot_bin: Godot.app/Contents/MacOS/Godot
          - target: windows
            arch: x64
            runner: windows-2025
            godot_asset: Godot_v4.5.2-stable_win64.exe.zip
            godot_sha: 3766090865330ab2a0ed33594520394b711c620b1378f9223904faeef60f2f14
            godot_bin: Godot_v4.5.2-stable_win64_console.exe
          - target: windows
            arch: arm64
            runner: windows-11-arm
            godot_asset: Godot_v4.5.2-stable_windows_arm64.exe.zip
            godot_sha: cedd4cb614a1c5c51ad1cd983b5d43c37e8c545ab9b397720edb885c1bd57538
            godot_bin: Godot_v4.5.2-stable_windows_arm64_console.exe
          - target: android
            arch: x64
            runner: ubuntu-24.04
            android_abi: x86_64
            godot_arch: x86_64
          - target: android
            arch: arm64
            runner: ubuntu-24.04
            android_abi: arm64-v8a
            godot_arch: arm64
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: qigao/vcpkg-cache/.github/actions/setup-llvm-mingw@v0.1.3
        id: mingw
        if: matrix.target == 'windows'
        with:
          target: ${{ matrix.arch }}
          build-type: toolchain-only
      - name: Build and test the QR Code extension
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ANDROID_ABI: ${{ matrix.android_abi }}
          GODOT_ARCH: ${{ matrix.godot_arch }}
          GODOT_ASSET: ${{ matrix.godot_asset }}
          GODOT_SHA: ${{ matrix.godot_sha }}
          GODOT_BIN: ${{ matrix.godot_bin }}
          MINGW_TOOLCHAIN: ${{ steps.mingw.outputs.toolchain-file }}
        run: |
          inputs="$RUNNER_TEMP/salts-qrcode"
          mkdir -p "$inputs"/{bindings,zxing}
          checksum=(sha256sum -c -)
          if [[ "$TARGET" == macos ]]; then
            checksum=(shasum -a 256 -c -)
          fi
          download() {
            local url=$1 sha=$2 file=$3
            curl -fsSL --retry 3 "$url" -o "$file"
            printf '%s  %s\n' "$sha" "$file" | "${checksum[@]}"
          }
          bindings=e83fd0904c13356ed1d4c3d09f8bb9132bdc6b77
          download "https://codeload.github.com/godotengine/godot-cpp/tar.gz/$bindings" \
            d4c03daf46c8bef4544614182b0762c3e32789151c7f8f44e8eb2053d5cddeba "$inputs/godot-cpp.tar.gz"
          download "https://github.com/zxing-cpp/zxing-cpp/releases/download/v3.1.1/zxing-cpp-3.1.1.tar.gz" \
            c3c02c29c0b519de7bd4e25b376e606e87f0761befd1282815642a2246613d14 "$inputs/zxing-cpp.tar.gz"
          (
            cd "$inputs"
            tar -xzf godot-cpp.tar.gz --strip-components=1 -C bindings
            tar -xzf zxing-cpp.tar.gz --strip-components=1 -C zxing
          )

          args=()
          case "$TARGET" in
            linux) args+=(-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++) ;;
            macos) args+=(-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
                         -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0) ;;
            windows) args+=("-DCMAKE_TOOLCHAIN_FILE=$MINGW_TOOLCHAIN") ;;
            android)
              ndk="$ANDROID_HOME/ndk/27.3.13750724"
              args+=("-DCMAKE_TOOLCHAIN_FILE=$ndk/build/cmake/android.toolchain.cmake"
                     "-DANDROID_ABI=$ANDROID_ABI" -DANDROID_PLATFORM=android-26 -DANDROID_STL=c++_static)
              ;;
          esac
          if [[ "$TARGET" != android ]]; then
            download "https://github.com/godotengine/godot-builds/releases/download/4.5.2-stable/$GODOT_ASSET" \
              "$GODOT_SHA" "$inputs/godot.zip"
            mkdir "$inputs/engine"
            (cd "$inputs/engine" && cmake -E tar xf ../godot.zip)
            args+=(-DBUILD_TESTING=ON "-DGODOT_EXECUTABLE=$inputs/engine/$GODOT_BIN")
          fi
          cmake -S src/salts_qrcode -B build-qrcode -G Ninja -DCMAKE_BUILD_TYPE=Release \
            "-DGODOT_CPP_DIR=$inputs/bindings" "-DZXING_CPP_DIR=$inputs/zxing" "${args[@]}"
          cmake --build build-qrcode --parallel 4
          if [[ "$TARGET" == android ]]; then
            python3 -B tests/salts_qrcode/check_android.py \
              "build-qrcode/addons/salts_qrcode/bin/android/$GODOT_ARCH/libsalts_qrcode.so" "$ndk" "$GODOT_ARCH"
          else
            ctest --test-dir build-qrcode --output-on-failure --verbose
          fi
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: salts-qrcode-build-${{ matrix.target }}-${{ matrix.arch }}
          path: build-qrcode/addons/salts_qrcode
          if-no-files-found: error
          overwrite: true

  package:
    name: Package the seven-platform add-on
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: salts-qrcode-build-*
          merge-multiple: true
          path: dist/addons/salts_qrcode
      - name: Verify packaged libraries
        shell: bash
        run: |
          descriptor=dist/addons/salts_qrcode/salts_qrcode.gdextension
          mapfile -t libraries < <(sed -n 's/^[^=]*= "res:\/\/\(.*\)"$/\1/p' "$descriptor")
          [[ "${#libraries[@]}" -eq 7 ]]
          for library in "${libraries[@]}"; do
            test -s "dist/$library"
            printf '%s\n' "$library"
          done
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: salts-qrcode-godot-4.5.2
          path: dist
          if-no-files-found: error
          overwrite: true
