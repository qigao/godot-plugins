name: Salts QR Code CI

on:
  pull_request:
    paths:
      - '.github/workflows/salts-qrcode.yml'
      - 'addons/salts_qrcode/**'
      - 'src/salts_qrcode/**'
      - 'tests/salts_qrcode/**'
      - 'tests/android/check_bundle.py'
  push:
    branches: [master]
    paths:
      - '.github/workflows/salts-qrcode.yml'
      - 'addons/salts_qrcode/**'
      - 'src/salts_qrcode/**'
      - 'tests/salts_qrcode/**'
      - 'tests/android/check_bundle.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            arch: x64
            runner: ubuntu-24.04
            godot_asset: Godot_v4.7.2-stable_linux.x86_64.zip
            godot_sha: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
            godot_bin: Godot_v4.7.2-stable_linux.x86_64
          - target: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            godot_asset: Godot_v4.7.2-stable_linux.arm64.zip
            godot_sha: 5dd0d86405cf7e8adf79fb6377b38ba682a2846cb378ffe5364f38c01ad29b9d
            godot_bin: Godot_v4.7.2-stable_linux.arm64
          - target: macos
            arch: arm64
            runner: macos-15
            godot_asset: Godot_v4.7.2-stable_macos.universal.zip
            godot_sha: c58a24e31d720be9d62f60cb5627c4e695fb72f21b0cfe1bc9ccaa9a3b3ba63e
            godot_bin: Godot.app/Contents/MacOS/Godot
          - target: windows
            arch: x64
            runner: windows-2025
            godot_asset: Godot_v4.7.2-stable_win64.exe.zip
            godot_sha: 731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953
            godot_bin: Godot_v4.7.2-stable_win64_console.exe
          - target: windows
            arch: arm64
            runner: windows-11-arm
            godot_asset: Godot_v4.7.2-stable_windows_arm64.exe.zip
            godot_sha: 2d206e0b1d2366eb3508971c670c52333dcd7218b818102d77ca7ceaa86892ba
            godot_bin: Godot_v4.7.2-stable_windows_arm64_console.exe
          - target: android
            arch: x64
            runner: ubuntu-24.04
            android_abi: x86_64
            godot_arch: x86_64
          - target: android
            arch: arm64
            runner: ubuntu-24.04
            android_abi: arm64-v8a
            godot_arch: arm64
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: qigao/vcpkg-cache/.github/actions/setup-llvm-mingw@v0.1.3
        id: mingw
        if: matrix.target == 'windows'
        with:
          target: ${{ matrix.arch }}
          build-type: toolchain-only
      - name: Build and test the QR Code extension
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ANDROID_ABI: ${{ matrix.android_abi }}
          GODOT_ARCH: ${{ matrix.godot_arch }}
          GODOT_ASSET: ${{ matrix.godot_asset }}
          GODOT_SHA: ${{ matrix.godot_sha }}
          GODOT_BIN: ${{ matrix.godot_bin }}
          MINGW_TOOLCHAIN: ${{ steps.mingw.outputs.toolchain-file }}
        run: |
          inputs="$RUNNER_TEMP/salts-qrcode"
          mkdir -p "$inputs"/{bindings,zxing}
          checksum=(sha256sum -c -)
          if [[ "$TARGET" == macos ]]; then
            checksum=(shasum -a 256 -c -)
          fi
          download() {
            local url=$1 sha=$2 file=$3
            curl -fsSL --retry 3 "$url" -o "$file"
            printf '%s  %s\n' "$sha" "$file" | "${checksum[@]}"
          }
          bindings=507ed9d840c01a3c5b2a39af8bb4000bfac30bf5
          download "https://codeload.github.com/godotengine/godot-cpp/tar.gz/$bindings" \
            30da4ac295997061a6af81ae531510efd4e6a86e506eb4466edc0898ef3fe048 "$inputs/godot-cpp.tar.gz"
          download "https://github.com/zxing-cpp/zxing-cpp/releases/download/v3.1.1/zxing-cpp-3.1.1.tar.gz" \
            c3c02c29c0b519de7bd4e25b376e606e87f0761befd1282815642a2246613d14 "$inputs/zxing-cpp.tar.gz"
          (
            cd "$inputs"
            tar -xzf godot-cpp.tar.gz --strip-components=1 -C bindings
            tar -xzf zxing-cpp.tar.gz --strip-components=1 -C zxing
          )

          args=()
          case "$TARGET" in
            linux) args+=(-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++) ;;
            macos) args+=(-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
                         -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0) ;;
            windows) args+=("-DCMAKE_TOOLCHAIN_FILE=$MINGW_TOOLCHAIN") ;;
            android)
              ndk="$ANDROID_HOME/ndk/27.3.13750724"
              args+=("-DCMAKE_TOOLCHAIN_FILE=$ndk/build/cmake/android.toolchain.cmake"
                     "-DANDROID_ABI=$ANDROID_ABI" -DANDROID_PLATFORM=android-26 -DANDROID_STL=c++_static)
              ;;
          esac
          if [[ "$TARGET" != android ]]; then
            download "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/$GODOT_ASSET" \
              "$GODOT_SHA" "$inputs/godot.zip"
            mkdir "$inputs/engine"
            (cd "$inputs/engine" && cmake -E tar xf ../godot.zip)
            args+=(-DBUILD_TESTING=ON "-DGODOT_EXECUTABLE=$inputs/engine/$GODOT_BIN")
          fi
          cmake -S src/salts_qrcode -B build-qrcode -G Ninja -DCMAKE_BUILD_TYPE=Release \
            "-DGODOT_CPP_DIR=$inputs/bindings" "-DZXING_CPP_DIR=$inputs/zxing" "${args[@]}"
          cmake --build build-qrcode --parallel 4
          if [[ "$TARGET" == android ]]; then
            python3 -B tests/salts_qrcode/check_android.py \
              "build-qrcode/addons/salts_qrcode/bin/android/$GODOT_ARCH/libsalts_qrcode.so" "$ndk" "$GODOT_ARCH"
          else
            ctest --test-dir build-qrcode --output-on-failure --verbose
          fi
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: salts-qrcode-build-${{ matrix.target }}-${{ matrix.arch }}
          path: build-qrcode/addons/salts_qrcode
          if-no-files-found: error
          overwrite: true

  package:
    name: Package the seven-platform add-on
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: salts-qrcode-build-*
          path: artifacts
      - name: Assemble and verify the add-on
        shell: bash
        run: |
          addon=dist/addons/salts_qrcode
          mkdir -p "$addon"
          # Use one copy of the metadata with consistent line endings.
          metadata=artifacts/salts-qrcode-build-linux-x64
          cp "$metadata"/{salts_qrcode.gdextension,README.md,THIRD_PARTY_NOTICES.txt,LICENSE.*} "$addon/"
          for artifact in artifacts/salts-qrcode-build-*; do
            cp -a "$artifact/bin" "$addon/"
          done
          descriptor="$addon/salts_qrcode.gdextension"
          mapfile -t libraries < <(sed -n 's/^[^=]*= "res:\/\/\(.*\)"$/\1/p' "$descriptor")
          [[ "${#libraries[@]}" -eq 7 ]]
          for library in "${libraries[@]}"; do
            test -s "dist/$library"
            printf '%s\n' "$library"
          done
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: salts-qrcode-godot-4.7.2
          path: dist
          if-no-files-found: error
          overwrite: true
